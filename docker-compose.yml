# TraceOn 로컬 개발 환경
#   전체 실행:        docker compose up -d --build   (neo4j + rule + rag + backend)
#   Neo4j만 실행:     docker compose up -d neo4j   (백엔드는 IntelliJ / gradlew bootRun으로 실행할 때)
# 실행 전 .env.example을 .env로 복사하고 NEO4J_PASSWORD를 설정해야 한다.

name: traceon

services:
  neo4j:
    image: neo4j:5.26.32-community
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser
      - "127.0.0.1:7687:7687"   # Bolt (애플리케이션 접속)
    environment:
      # 비밀번호가 비어 있으면 compose 단계에서 즉시 실패시킨다.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?.env에 NEO4J_PASSWORD(8자 이상)를 설정하세요}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      # HI-Small(거래 약 500만 건) 저장소 크기를 고려해 페이지 캐시를 1g로 설정
      NEO4J_server_memory_pagecache_size: 1g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      # 적재용 파일 (data-pipeline/neo4j_export.py 결과)과 스키마 스크립트. 읽기 전용.
      - ./data/import:/import:ro
      - ./data-pipeline/neo4j:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # 룰 점수 서비스. 공통 Graph JSON만 받으며 DB 자격증명이 없다.
  rule:
    build: ./rule-service
    read_only: true
    tmpfs:
      - /tmp

  # RAG 근거·초안 서비스. 사전에 만든 로컬 색인(data/rag)을 읽기 전용으로 사용한다.
  # 색인이 없으면 시작하지 않는다 → docs/team-handoff.md의 "RAG API 실행" 1회 준비 필요.
  rag:
    build:
      context: ./rag-service
      additional_contexts:
        rule_sources: ./rule-service
    command: ["python", "rag-service/rag_server.py", "--host", "0.0.0.0", "--port", "8092", "--judge-host", "rag"]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # 비어 있으면 template 모드(LLM 호출 없음). 키는 .env에만 두고 Git에 올리지 않는다.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - ./data/rag:/app/data/rag:ro

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    environment:
      # 컨테이너 안에서는 서비스 이름으로 접속한다.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_HTTP_URL: http://neo4j:7474
      SERVER_ADDRESS: 0.0.0.0
      TRACEON_MANIFEST: /app/demo/manifest.json
      TRACEON_SCORE_FILE: /app/demo/demo-scores.json
      TRACEON_HISTORY_DB: /app/history/spring-analysis.sqlite3
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: file:/app/frontend/
      RULE_URL: http://rule:8091/v1/rules/score
      RAG_URL: http://rag:8092
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    volumes:
      - ./data/processed/HI-Small-MVP:/app/demo:ro
      - ./frontend/static:/app/frontend:ro
      - backend_history:/app/history
    depends_on:
      neo4j:
        condition: service_healthy
      rule:
        condition: service_healthy
      # RAG는 초안 기능에만 필요하다. 꺼져 있어도 그래프·저장본 열기는 동작한다(초안 API만 503).
      rag:
        condition: service_started
        required: false

volumes:
  neo4j_data:
  neo4j_logs:
  backend_history:
